<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Pillippa Pérez Pons, software engineer, with an animated black cat" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .serif { font-family: Georgia, "Times New Roman", Times, serif; }
  </style>

  <!-- paper + frame -->
  <rect x="4" y="4" width="1192" height="352" fill="#F4F0E6" stroke="#111" stroke-width="8"/>

  <!-- masthead strip -->
  <rect x="8" y="8" width="1184" height="44" fill="#111"/>
  <text x="32" y="37" class="mono" font-size="15" letter-spacing="3" fill="#F4F0E6">THE MAKE/ROOM TIMES</text>
  <text x="600" y="37" class="mono" font-size="15" letter-spacing="3" fill="#FFD23F" text-anchor="middle">README EDITION</text>
  <text x="1168" y="37" class="mono" font-size="15" letter-spacing="3" fill="#F4F0E6" text-anchor="end">OAKLAND ⇄ SANTIAGO</text>

  <!-- color blocks -->
  <rect x="32" y="74" width="120" height="14" fill="#FF4FA3"/>
  <rect x="152" y="74" width="80" height="14" fill="#FFD23F"/>
  <rect x="232" y="74" width="50" height="14" fill="#2D5BFF"/>

  <!-- name -->
  <text x="30" y="160" class="serif" font-size="70" font-weight="700" fill="#111" letter-spacing="-1.5">Pillippa Pérez Pons</text>
  <line x1="8" y1="186" x2="1192" y2="186" stroke="#111" stroke-width="4"/>

  <!-- typing lines -->
  <text x="32" y="246" class="mono" font-size="26" font-weight="700" fill="#FF4FA3">&gt;</text>

  <clipPath id="c1"><rect x="62" y="215" height="44" width="0"><animate attributeName="width" values="0;540;540;0;0" keyTimes="0;0.1333;0.2667;0.3333;1" dur="12s" begin="0s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="c2"><rect x="62" y="215" height="44" width="0"><animate attributeName="width" values="0;476;476;0;0" keyTimes="0;0.1333;0.2667;0.3333;1" dur="12s" begin="4s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="c3"><rect x="62" y="215" height="44" width="0"><animate attributeName="width" values="0;460;460;0;0" keyTimes="0;0.1333;0.2667;0.3333;1" dur="12s" begin="8s" repeatCount="indefinite"/></rect></clipPath>
  <g class="mono" font-size="26" fill="#111">
    <text x="62" y="246" clip-path="url(#c1)">Frontend-focused software engineer</text>
    <text x="62" y="246" clip-path="url(#c2)">Design systems + accessibility</text>
    <text x="62" y="246" clip-path="url(#c3)">Building AI agents, curiously</text>
  </g>
  <rect x="62" y="224" width="14" height="28" fill="#2D5BFF" opacity="0">
    <animate attributeName="x" values="62;608;608;62;62" keyTimes="0;0.1333;0.2667;0.3333;1" dur="12s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" keyTimes="0;0.3333" calcMode="discrete" dur="12s" begin="0s" repeatCount="indefinite"/>
  </rect>
  <rect x="62" y="224" width="14" height="28" fill="#2D5BFF" opacity="0">
    <animate attributeName="x" values="62;544;544;62;62" keyTimes="0;0.1333;0.2667;0.3333;1" dur="12s" begin="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" keyTimes="0;0.3333" calcMode="discrete" dur="12s" begin="4s" repeatCount="indefinite"/>
  </rect>
  <rect x="62" y="224" width="14" height="28" fill="#2D5BFF" opacity="0">
    <animate attributeName="x" values="62;528;528;62;62" keyTimes="0;0.1333;0.2667;0.3333;1" dur="12s" begin="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" keyTimes="0;0.3333" calcMode="discrete" dur="12s" begin="8s" repeatCount="indefinite"/>
  </rect>

  <!-- footer strip -->
  <line x1="8" y1="300" x2="1192" y2="300" stroke="#111" stroke-width="4"/>
  <text x="32" y="333" class="mono" font-size="15" letter-spacing="2" fill="#111">REACT · TYPESCRIPT · DESIGN SYSTEMS · AI AGENTS · PYTHON</text>

  <!-- speech bubble -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.45;0.5;0.8;0.85;1" dur="8s" repeatCount="indefinite"/>
    <rect x="772" y="72" width="196" height="40" fill="#FFD23F" stroke="#111" stroke-width="3"/>
    <polygon points="930,112 950,112 962,132" fill="#FFD23F" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
    <rect x="931" y="108" width="18" height="6" fill="#FFD23F"/>
    <text x="870" y="98" class="mono" font-size="16" font-weight="700" fill="#111" text-anchor="middle">git push --meow</text>
  </g>

  <!-- cat (Corchito-inspired) -->
  <g>
    <!-- tail -->
    <path d="M1080 292 C1135 298 1150 248 1126 214" fill="none" stroke="#111" stroke-width="14" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="0 1080 292;-14 1080 292;0 1080 292;9 1080 292;0 1080 292" dur="3.2s" repeatCount="indefinite"/>
    </path>
    <!-- body -->
    <ellipse cx="1030" cy="248" rx="56" ry="50" fill="#111"/>
    <!-- paws -->
    <ellipse cx="1010" cy="296" rx="15" ry="7" fill="#111"/>
    <ellipse cx="1050" cy="296" rx="15" ry="7" fill="#111"/>
    <!-- ears -->
    <polygon points="996,158 999,116 1024,146" fill="#111"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 1050 150;0 1050 150;14 1050 150;0 1050 150;0 1050 150" keyTimes="0;0.6;0.63;0.66;1" dur="5s" repeatCount="indefinite"/>
      <polygon points="1064,158 1061,116 1036,146" fill="#111"/>
      <polygon points="1059,148 1058,128 1047,144" fill="#FF4FA3"/>
    </g>
    <polygon points="1001,148 1002,128 1013,144" fill="#FF4FA3"/>
    <!-- head -->
    <circle cx="1030" cy="178" r="40" fill="#111"/>
    <!-- eyes -->
    <ellipse cx="1015" cy="174" rx="8" ry="10" fill="#FFD23F">
      <animate attributeName="ry" values="10;10;1;10;10" keyTimes="0;0.9;0.93;0.96;1" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="1045" cy="174" rx="8" ry="10" fill="#FFD23F">
      <animate attributeName="ry" values="10;10;1;10;10" keyTimes="0;0.9;0.93;0.96;1" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="1015" cy="174" rx="2.5" ry="8" fill="#111">
      <animate attributeName="ry" values="8;8;0.5;8;8" keyTimes="0;0.9;0.93;0.96;1" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="1045" cy="174" rx="2.5" ry="8" fill="#111">
      <animate attributeName="ry" values="8;8;0.5;8;8" keyTimes="0;0.9;0.93;0.96;1" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <!-- nose -->
    <polygon points="1025,189 1035,189 1030,195" fill="#FF4FA3"/>
    <!-- whiskers -->
    <g stroke="#8A8579" stroke-width="2" stroke-linecap="round">
      <line x1="1000" y1="192" x2="966" y2="186"/>
      <line x1="1000" y1="198" x2="964" y2="200"/>
      <line x1="1060" y1="192" x2="1094" y2="186"/>
      <line x1="1060" y1="198" x2="1096" y2="200"/>
    </g>
    <!-- collar -->
    <rect x="1000" y="212" width="60" height="9" rx="4" fill="#2D5BFF"/>
    <circle cx="1030" cy="227" r="7" fill="#FFD23F" stroke="#111" stroke-width="2"/>
  </g>
<metadata>
<c2pa:manifest></c2pa:manifest></metadata></svg>
